<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' material: data: blob:; font-src 'self'; connect-src 'self' material: https://api.openai.com; worker-src 'self' blob:;"
    />
    <title>StudyFlow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-view="auth">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">SF</span>
        <span class="brand-name">StudyFlow</span>
      </div>
      <div class="topbar-actions">
        <button id="new-plan" class="btn btn-primary" type="button">New plan</button>
        <button id="sign-out" class="btn btn-ghost" type="button">Sign out</button>
        <span id="user-chip" class="chip"></span>
      </div>
    </header>

    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view"></main>

    <script type="module" src="app.js"></script>
  </body>
</html>
